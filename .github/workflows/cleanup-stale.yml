name: "Cleanup Stale Branches and PRs"
# R25: Branch lifecycle enforcement — runs daily + on demand
# Squash-merge-aware: detects merged branches via gh pr list (not git ancestry)
on:
  schedule:
    - cron: "0 3 * * *"  # 03:00 UTC daily
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

env:
  GH_TOKEN: ${{ github.token }}

jobs:
  stale-prs:
    name: "Mark and close stale PRs"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@v9
        with:
          stale-pr-message: "This PR has been inactive for 7 days. It will be closed in 7 more days unless there is activity."
          close-pr-message: "Closing stale PR due to inactivity. Reopen if still relevant."
          days-before-pr-stale: 7
          days-before-pr-close: 7
          stale-pr-label: "stale"
          exempt-pr-labels: "keep-open,wip,defer-merge"

  delete-ancestor-merged:
    name: "Delete branches merged via merge-commit"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Delete git-ancestry-merged branches
        run: |
          git fetch --prune
          DELETED=0
          for branch in $(git branch -r --merged origin/main \
              | grep -v 'origin/main\|origin/HEAD\|origin/rescue/' \
              | sed 's/  origin\///'); do
            echo "Deleting ancestor-merged branch: $branch"
            git push origin --delete "$branch" 2>/dev/null && DELETED=$((DELETED+1)) || true
          done
          echo "Deleted $DELETED ancestor-merged branches"

  delete-squash-merged:
    name: "Delete branches merged via squash (R25)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Delete squash-merged branches
        run: |
          git fetch --prune
          DELETED=0
          # Get all branches merged via squash PRs (last 200 merged PRs)
          gh pr list --state merged --limit 200 \
            --json headRefName,mergedAt \
            --jq '.[] | .headRefName' \
          | while read branch; do
            # Skip protected/exempt branches
            if echo "$branch" | grep -qE '^(main|rescue/)'; then
              continue
            fi
            # Delete if remote still exists
            if git ls-remote --exit-code origin "refs/heads/$branch" &>/dev/null; then
              echo "Deleting squash-merged branch: $branch"
              git push origin --delete "$branch" 2>/dev/null && DELETED=$((DELETED+1)) || true
            fi
          done
          echo "Squash-merge cleanup done"

  warn-stale-no-pr:
    name: "Report branches older than 21d with no PR"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: List stale branches without open PR
        run: |
          git fetch --prune
          NOW=$(date +%s)
          THRESHOLD=$((NOW - 21 * 86400))
          echo "## Branches >21d without open PR" >> $GITHUB_STEP_SUMMARY
          echo "| Branch | Age (days) | Last commit |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|-----------|------------|" >> $GITHUB_STEP_SUMMARY
          for branch in $(git branch -r \
              | grep -v 'origin/main\|origin/HEAD\|origin/rescue/' \
              | sed 's/  origin\///'); do
            COMMIT_DATE=$(git log -1 --format=%ct "origin/$branch" 2>/dev/null || echo 0)
            if [ "$COMMIT_DATE" -lt "$THRESHOLD" ] && [ "$COMMIT_DATE" -ne 0 ]; then
              # Check if there is an open PR for this branch
              PR_COUNT=$(gh pr list --head "$branch" --state open --json number --jq 'length' 2>/dev/null || echo 0)
              if [ "$PR_COUNT" -eq 0 ]; then
                AGE=$(( (NOW - COMMIT_DATE) / 86400 ))
                LAST=$(git log -1 --format="%ci" "origin/$branch" 2>/dev/null | cut -c1-10)
                echo "| $branch | $AGE | $LAST |" >> $GITHUB_STEP_SUMMARY
              fi
            fi
          done
