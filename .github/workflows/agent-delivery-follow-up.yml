name: Agent Delivery Follow-Up

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      runtime_url:
        description: "Runtime base URL override"
        required: false
        type: string
      consumer_adoption_readback_json:
        description: "Structured consumer adoption read-back JSON from a deployed consumer or governed runner"
        required: false
        type: string

permissions:
  contents: read
  issues: write

jobs:
  follow-up:
    name: Verify main push runtime proof
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      WIDGETDC_CONTRACTS_RUNTIME_URL: ${{ inputs.runtime_url || secrets.WIDGETDC_CONTRACTS_RUNTIME_URL || vars.WIDGETDC_CONTRACTS_RUNTIME_URL }}
      RAILWAY_URL: ${{ secrets.RAILWAY_URL || vars.RAILWAY_URL }}
      BACKEND_URL: ${{ secrets.BACKEND_URL || vars.BACKEND_URL }}
      CONSUMER_ADOPTION_READBACK_JSON: ${{ inputs.consumer_adoption_readback_json || secrets.CONSUMER_ADOPTION_READBACK_JSON || vars.CONSUMER_ADOPTION_READBACK_JSON }}
      CONSUMER_ADOPTION_READBACK_PATH: ${{ vars.CONSUMER_ADOPTION_READBACK_PATH }}
      RUNTIME_EVIDENCE_PATH: runtime-evidence.json
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js when package.json exists
        if: ${{ hashFiles('package.json') != '' }}
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies when package.json exists
        if: ${{ hashFiles('package.json') != '' }}
        run: npm install --legacy-peer-deps --ignore-scripts

      - name: Wait for Railway rollout window
        if: ${{ env.WIDGETDC_CONTRACTS_RUNTIME_URL != '' || env.RAILWAY_URL != '' || env.BACKEND_URL != '' }}
        run: sleep 45

      - name: Verify runtime proof read-back
        id: runtime-proof
        if: ${{ hashFiles('package.json') != '' }}
        run: npm run runtime:proof:readback

      - name: Upload runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-evidence-${{ github.sha }}
          path: runtime-evidence.json
          if-no-files-found: warn

      - name: Write summary
        if: always()
        shell: bash
        run: |
          {
            echo "### Agent Delivery Follow-Up"
            echo ""
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Branch: \`${GITHUB_REF_NAME}\`"
            echo "- Runtime URL configured: \`${{ env.WIDGETDC_CONTRACTS_RUNTIME_URL != '' || env.RAILWAY_URL != '' || env.BACKEND_URL != '' }}\`"
            echo "- Consumer adoption read-back configured: \`${{ env.CONSUMER_ADOPTION_READBACK_JSON != '' || env.CONSUMER_ADOPTION_READBACK_PATH != '' }}\`"
            echo "- Runtime proof status: \`${{ steps.runtime-proof.outputs.status || 'unavailable' }}\`"
            echo "- Runtime evidence artifact: \`runtime-evidence-${GITHUB_SHA}\`"
            echo "- Result: ${{ job.status }}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Open follow-up issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Deployment follow-up failed on main: ${context.sha.slice(0, 7)}`,
              body: [
                '## Agent Delivery Follow-Up Failure',
                '',
                `- Commit: ${context.sha}`,
                `- Branch: ${context.ref}`,
                `- Workflow: ${context.workflow}`,
                '',
                'The repository reached `main`, but runtime proof read-back did not complete with claim-grade evidence.',
                'Expected evidence includes deployed SHA, runtime correlation ID, and EventSpine replay count >= 1.',
                'Treat this as `BLOCKED_RUNTIME`; do not claim deployed, runtime-proven, or promoted status from this run.',
                '',
                `[Open workflow run](${context.payload.repository.html_url}/actions/runs/${context.runId})`
              ].join('\n'),
              labels: ['deployment', 'follow-up', 'main', 'runtime-proof']
            });
